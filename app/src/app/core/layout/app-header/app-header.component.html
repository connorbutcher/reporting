<header class="app-header">
  <div class="app-header-brand">
    <span class="app-header-mark" aria-hidden="true">
      <i class="pi pi-chart-bar"></i>
    </span>
    <span class="app-header-name">{{ title() }}</span>
  </div>

  <nav class="app-header-nav" aria-label="Sections">
    <a
      class="app-header-link"
      routerLink="/"
      routerLinkActive="app-header-link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>
  </nav>
</header>
