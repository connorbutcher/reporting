@if (barChart(); as bar) {
  <app-panel-group label="Data source" icon="⛁">
    <label class="panel-field">
      <span class="panel-field-label">Dataset</span>
      <p-select
        [options]="datasets()"
        [ngModel]="bar.datasetId()"
        optionLabel="name"
        optionValue="id"
        placeholder="Select a dataset"
        appendTo="body"
        [showClear]="true"
        fluid
        (onChange)="bar.setDataset($event.value ?? null)"
      />
    </label>
  </app-panel-group>

  <app-panel-group label="Bars" icon="＋">
    <label class="panel-field">
      <span class="panel-field-label">Category</span>
      <p-select
        [options]="bar.schema()?.columns ?? []"
        [ngModel]="bar.xColumnId()"
        optionLabel="name"
        optionValue="id"
        placeholder="Group bars by"
        appendTo="body"
        [disabled]="!bar.datasetId()"
        fluid
        (onChange)="bar.xColumnId.set($event.value ?? null)"
      />
    </label>
    <div class="panel-grid-fields">
      <label class="panel-field">
        <span class="panel-field-label">Summarise</span>
        <p-select
          [options]="aggregates"
          [ngModel]="bar.aggregate()"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [disabled]="!bar.datasetId()"
          fluid
          (onChange)="bar.aggregate.set($event.value)"
        />
      </label>
      <label class="panel-field">
        <span class="panel-field-label">Value</span>
        <p-select
          [options]="bar.numericColumns()"
          [ngModel]="bar.yColumnId()"
          optionLabel="name"
          optionValue="id"
          [placeholder]="bar.needsValue() ? 'Column' : 'Not needed'"
          appendTo="body"
          [showClear]="true"
          [disabled]="!bar.datasetId() || !bar.needsValue()"
          fluid
          (onChange)="bar.yColumnId.set($event.value ?? null)"
        />
      </label>
    </div>
  </app-panel-group>

  <app-panel-group label="Series" icon="◐">
    <label class="panel-field">
      <span class="panel-field-label">Colour by (optional)</span>
      <p-select
        [options]="bar.schema()?.columns ?? []"
        [ngModel]="bar.seriesColumnId()"
        optionLabel="name"
        optionValue="id"
        placeholder="One series"
        appendTo="body"
        [showClear]="true"
        [disabled]="!bar.datasetId()"
        fluid
        (onChange)="bar.seriesColumnId.set($event.value ?? null)"
      />
    </label>
  </app-panel-group>

  <button
    type="button"
    class="panel-menu-item"
    [disabled]="!bar.datasetId()"
    (click)="navigate({ kind: 'widgetFilters', widgetId: bar.id })"
  >
    <i class="pi pi-filter" aria-hidden="true"></i>
    <span class="panel-menu-text">
      <span class="panel-menu-label">Filters</span>
      <span class="panel-menu-hint">
        {{
          !bar.datasetId()
            ? 'Pick a dataset first'
            : bar.filter.count() === 0
              ? 'Showing every row'
              : bar.filter.count() + ' condition' + (bar.filter.count() > 1 ? 's' : '')
        }}
      </span>
    </span>
    <i class="pi pi-angle-right" aria-hidden="true"></i>
  </button>
} @else {
  <!-- Scatter/line: one card per dataset overlaid on the shared axes. -->
  @for (binding of chart().bindings(); track binding.id; let i = $index) {
    <app-panel-group
      [label]="chart().bindings().length > 1 ? 'Dataset ' + (i + 1) : 'Data source'"
      icon="⛁"
    >
      <label class="panel-field">
        <span class="panel-field-label">Dataset</span>
        <p-select
          [options]="datasets()"
          [ngModel]="binding.datasetId()"
          optionLabel="name"
          optionValue="id"
          placeholder="Select a dataset"
          appendTo="body"
          [showClear]="true"
          fluid
          (onChange)="binding.setDataset($event.value ?? null)"
        />
      </label>

      <div class="panel-grid-fields">
        <label class="panel-field">
          <span class="panel-field-label">X axis</span>
          <p-select
            [options]="binding.axisColumns()"
            [ngModel]="binding.xColumnId()"
            optionLabel="name"
            optionValue="id"
            placeholder="Column"
            appendTo="body"
            [disabled]="!binding.datasetId()"
            fluid
            (onChange)="binding.xColumnId.set($event.value ?? null)"
          />
        </label>
        <label class="panel-field">
          <span class="panel-field-label">Y axis</span>
          <p-select
            [options]="binding.axisColumns()"
            [ngModel]="binding.yColumnId()"
            optionLabel="name"
            optionValue="id"
            placeholder="Column"
            appendTo="body"
            [disabled]="!binding.datasetId()"
            fluid
            (onChange)="binding.yColumnId.set($event.value ?? null)"
          />
        </label>
      </div>

      <label class="panel-field">
        <span class="panel-field-label">Colour by (optional)</span>
        <p-select
          [options]="binding.schema()?.columns ?? []"
          [ngModel]="binding.seriesColumnId()"
          optionLabel="name"
          optionValue="id"
          placeholder="One series"
          appendTo="body"
          [showClear]="true"
          [disabled]="!binding.datasetId()"
          fluid
          (onChange)="binding.seriesColumnId.set($event.value ?? null)"
        />
      </label>

      <button
        type="button"
        class="panel-menu-item"
        [disabled]="!binding.datasetId()"
        (click)="navigate({ kind: 'widgetFilters', widgetId: chart().id, bindingId: binding.id })"
      >
        <i class="pi pi-filter" aria-hidden="true"></i>
        <span class="panel-menu-text">
          <span class="panel-menu-label">Filters</span>
          <span class="panel-menu-hint">
            {{
              !binding.datasetId()
                ? 'Pick a dataset first'
                : binding.filter.count() === 0
                  ? 'Showing every point'
                  : binding.filter.count() + ' condition' + (binding.filter.count() > 1 ? 's' : '')
            }}
          </span>
        </span>
        <i class="pi pi-angle-right" aria-hidden="true"></i>
      </button>

      @if (chart().bindings().length > 1) {
        <p-button
          label="Remove dataset"
          icon="pi pi-trash"
          severity="danger"
          text
          fluid
          (onClick)="chart().removeBinding(binding.id)"
        />
      }
    </app-panel-group>
  }

  <p-button
    label="Add dataset"
    icon="pi pi-plus"
    severity="secondary"
    outlined
    fluid
    (onClick)="chart().addBinding()"
  />
}

<app-panel-group label="Appearance" icon="▤">
  <div class="panel-grid-fields">
    <label class="panel-field">
      <span class="panel-field-label">X axis label</span>
      <input
        pInputText
        [ngModel]="chart().xAxisLabel()"
        (ngModelChange)="chart().xAxisLabel.set($event)"
        [placeholder]="axisPlaceholder(chart().xColumnId())"
      />
    </label>
    <label class="panel-field">
      <span class="panel-field-label">Y axis label</span>
      <input
        pInputText
        [ngModel]="chart().yAxisLabel()"
        (ngModelChange)="chart().yAxisLabel.set($event)"
        [placeholder]="axisPlaceholder(chart().yColumnId())"
      />
    </label>
  </div>

  @if (!barChart()) {
    <label class="panel-field">
      <span class="panel-field-label">Point size (px)</span>
      <p-inputnumber
        [ngModel]="chart().pointSize()"
        (ngModelChange)="chart().pointSize.set($event ?? 8)"
        [min]="2"
        [max]="40"
        fluid
      />
    </label>
  }

  <div class="panel-inline-field">
    <p-checkbox
      [binary]="true"
      inputId="chart-legend"
      [ngModel]="chart().showLegend()"
      (onChange)="chart().showLegend.set($event.checked)"
    />
    <label for="chart-legend">Show legend</label>
  </div>

  @if (lineChart(); as line) {
    <app-panel-line-chart-options [chart]="line" />
  }
  @if (barChart(); as bar) {
    <app-panel-bar-chart-options [chart]="bar" />
  }
</app-panel-group>

<app-panel-chart-tolerance-list [chart]="chart()" />

@if (!barChart()) {
  <app-panel-chart-tooltip-columns [chart]="chart()" />
}
