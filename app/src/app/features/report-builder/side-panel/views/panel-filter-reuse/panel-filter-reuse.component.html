@if (reusable().length > 0 || canPromoteNow()) {
  <div class="panel-filter-reuse">
    @if (reusable().length > 0) {
      <button
        type="button"
        class="reuse-link"
        aria-label="Copy conditions from another filter on this dataset"
        (click)="menu.toggle($event)"
      >
        <i class="pi pi-copy" aria-hidden="true"></i>
        Copy from…
      </button>
      <p-menu #menu [model]="copyMenu()" [popup]="true" appendTo="body" />
    }

    @if (canPromoteNow()) {
      <button type="button" class="reuse-link" (click)="promote()">
        <i class="pi pi-arrow-up" aria-hidden="true"></i>
        Promote to report filter
      </button>
    }
  </div>
}
