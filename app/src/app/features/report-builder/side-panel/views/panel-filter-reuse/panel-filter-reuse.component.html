@if (reusable().length > 0 || canPromoteNow()) {
  <div class="panel-filter-reuse">
    @if (reusable().length > 0) {
      <p-button
        label="Copy from…"
        icon="pi pi-copy"
        severity="secondary"
        text
        size="small"
        fluid
        ariaLabel="Copy conditions from another filter on this dataset"
        (onClick)="menu.toggle($event)"
      />
      <p-menu #menu [model]="copyMenu()" [popup]="true" appendTo="body" />
    }

    @if (canPromoteNow()) {
      <p-button
        label="Promote to report filter"
        icon="pi pi-arrow-up"
        severity="secondary"
        text
        size="small"
        fluid
        (onClick)="promote()"
      />
    }
  </div>
}
