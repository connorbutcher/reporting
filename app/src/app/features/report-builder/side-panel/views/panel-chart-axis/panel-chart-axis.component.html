@if (chart(); as chart) {
  @if (isX()) {
    <app-panel-chart-x-axis [chart]="chart" />
  } @else if (yAxis(); as y) {
    <app-panel-chart-y-axis [chart]="chart" [axis]="y.axis" [index]="y.index" />
  } @else {
    <p class="panel-empty">This axis is no longer on the chart.</p>
  }
} @else {
  <p class="panel-empty">This axis is no longer on the chart.</p>
}
