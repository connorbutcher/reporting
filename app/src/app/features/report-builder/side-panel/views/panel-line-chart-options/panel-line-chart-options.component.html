<label class="panel-field">
  <span class="panel-field-label">Points per X value</span>
  <p-select
    [options]="aggregates"
    [ngModel]="chart().aggregate()"
    optionLabel="label"
    optionValue="value"
    appendTo="body"
    fluid
    (onChange)="chart().aggregate.set($event.value ?? null)"
  />
</label>
@if (chart().aggregate() && xIsDate()) {
  <label class="panel-field">
    <span class="panel-field-label">Group dates by</span>
    <p-select
      [options]="groupings"
      [ngModel]="chart().xGrouping()"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      fluid
      (onChange)="chart().xGrouping.set($event.value ?? null)"
    />
  </label>
}
<div class="panel-inline-field">
  <p-checkbox
    [binary]="true"
    inputId="chart-smooth"
    [ngModel]="chart().smooth()"
    (onChange)="chart().smooth.set($event.checked)"
  />
  <label for="chart-smooth">Smooth</label>
</div>
<div class="panel-inline-field">
  <p-checkbox
    [binary]="true"
    inputId="chart-show-points"
    [ngModel]="chart().showPoints()"
    (onChange)="chart().showPoints.set($event.checked)"
  />
  <label for="chart-show-points">Show points</label>
</div>
<div class="panel-inline-field">
  <p-checkbox
    [binary]="true"
    inputId="chart-area-fill"
    [ngModel]="chart().areaFill()"
    (onChange)="chart().areaFill.set($event.checked)"
  />
  <label for="chart-area-fill">Area fill</label>
</div>
