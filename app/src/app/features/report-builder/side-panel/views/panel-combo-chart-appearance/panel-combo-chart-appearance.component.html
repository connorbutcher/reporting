<div class="panel-inline-field">
  <p-checkbox
    [binary]="true"
    inputId="chart-value-labels"
    [ngModel]="chart().showValueLabels()"
    (onChange)="chart().showValueLabels.set($event.checked)"
  />
  <label for="chart-value-labels">Show value labels</label>
</div>

<app-panel-chart-sort
  [sort]="chart().sort()"
  [columns]="chart().schema()?.columns ?? []"
  [categoryColumnId]="chart().xColumnId()"
  [grouping]="chart().categoryGrouping()"
  [showTopN]="true"
  defaultLabel="Category order"
  (sortChange)="chart().sort.set($event)"
  (groupingChange)="chart().categoryGrouping.set($event)"
/>

<div class="panel-inline-field">
  <p-checkbox
    [binary]="true"
    inputId="chart-stacked"
    [ngModel]="chart().stacked()"
    [disabled]="!chart().multiSeries()"
    (onChange)="chart().stacked.set($event.checked)"
  />
  <label for="chart-stacked">Stack bars</label>
</div>

@if (chart().hasLineSeries()) {
  <div class="panel-inline-field">
    <p-checkbox
      [binary]="true"
      inputId="chart-smooth"
      [ngModel]="chart().smooth()"
      (onChange)="chart().smooth.set($event.checked)"
    />
    <label for="chart-smooth">Smooth lines</label>
  </div>
  <div class="panel-inline-field">
    <p-checkbox
      [binary]="true"
      inputId="chart-show-points"
      [ngModel]="chart().showPoints()"
      (onChange)="chart().showPoints.set($event.checked)"
    />
    <label for="chart-show-points">Show line points</label>
  </div>
  <div class="panel-inline-field">
    <p-checkbox
      [binary]="true"
      inputId="chart-area-fill"
      [ngModel]="chart().areaFill()"
      (onChange)="chart().areaFill.set($event.checked)"
    />
    <label for="chart-area-fill">Area fill</label>
  </div>
  <div class="panel-inline-field">
    <p-checkbox
      [binary]="true"
      inputId="chart-connect-nulls"
      [ngModel]="chart().connectNulls()"
      (onChange)="chart().connectNulls.set($event.checked)"
    />
    <label for="chart-connect-nulls">Connect lines across missing categories</label>
  </div>
}

<div class="panel-inline-field">
  <p-checkbox
    [binary]="true"
    inputId="chart-category-zoom"
    [ngModel]="chart().zoom()"
    (onChange)="chart().zoom.set($event.checked)"
  />
  <label for="chart-category-zoom">Zoom &amp; pan slider when there are over 20 categories</label>
</div>
