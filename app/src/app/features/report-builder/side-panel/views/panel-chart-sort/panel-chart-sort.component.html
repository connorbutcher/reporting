@if (showGrouping()) {
  <label class="panel-field">
    <span class="panel-field-label">Group dates by</span>
    <p-select
      [options]="groupings"
      [ngModel]="grouping() ?? null"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      fluid
      (onChange)="groupingChange.emit($event.value ?? null)"
    />
  </label>
}

<label class="panel-field">
  <span class="panel-field-label">Order by</span>
  <p-select
    [options]="byOptions()"
    [ngModel]="resolved().by"
    optionLabel="label"
    optionValue="value"
    appendTo="body"
    fluid
    (onChange)="setBy($event.value)"
  />
</label>

@if (resolved().by === 'column') {
  <label class="panel-field">
    <span class="panel-field-label">Column</span>
    <p-select
      [options]="columns()"
      [ngModel]="resolved().columnId"
      optionLabel="name"
      optionValue="id"
      placeholder="Pick a column"
      appendTo="body"
      fluid
      (onChange)="setColumn($event.value ?? null)"
    />
  </label>

  @if (showAggregate()) {
    <label class="panel-field">
      <span class="panel-field-label">Reduce each category by</span>
      <p-select
        [options]="aggregateOptions()"
        [ngModel]="resolved().aggregate"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        fluid
        (onChange)="setAggregate($event.value)"
      />
    </label>
    @if (showAggregateHint()) {
      <p class="panel-hint">
        Only matters if a category has more than one different value here — otherwise Direction
        alone decides the order.
      </p>
    }
  }
}

<label class="panel-field">
  <span class="panel-field-label">Direction</span>
  <p-select
    [options]="directionOptions"
    [ngModel]="resolved().descending"
    optionLabel="label"
    optionValue="value"
    appendTo="body"
    fluid
    (onChange)="setDescending($event.value)"
  />
</label>

@if (showTopN()) {
  <label class="panel-field">
    <span class="panel-field-label">Show only the first</span>
    <p-inputnumber
      [ngModel]="resolved().limit ?? null"
      (ngModelChange)="setLimit($event)"
      [min]="1"
      [maxFractionDigits]="0"
      placeholder="All categories"
      suffix=" categories"
      fluid
    />
  </label>
  @if (resolved().limit) {
    <div class="panel-inline-field">
      <p-checkbox
        [binary]="true"
        inputId="chart-sort-show-other"
        [ngModel]="resolved().showOther ?? false"
        (onChange)="setShowOther($event.checked)"
      />
      <label for="chart-sort-show-other">Group the rest as “Other”</label>
    </div>
  }
}
