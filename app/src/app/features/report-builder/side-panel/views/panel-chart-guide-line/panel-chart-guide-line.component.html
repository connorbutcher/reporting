@if (line(); as line) {
  <div class="panel-section">
    <p class="panel-hint">A dashed line at a fixed value, captioned with a label.</p>

    <app-panel-group label="Axis" icon="＋">
      <label class="panel-field">
        <span class="panel-field-label">Plot against</span>
        <p-selectbutton
          [options]="axisOptions()"
          [ngModel]="line.axis"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          (ngModelChange)="setAxis($event)"
        />
      </label>

      @if (line.axis === 'y' && yAxisOptions().length > 1) {
        <label class="panel-field">
          <span class="panel-field-label">Y axis</span>
          <p-select
            [options]="yAxisOptions()"
            [ngModel]="line.yAxisId ?? yAxisOptions()[0].value"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            fluid
            (onChange)="setYAxis($event.value ?? null)"
          />
        </label>
        <p class="panel-hint">The line draws on this axis's scale — pick the one its series uses.</p>
      }
    </app-panel-group>

    <app-panel-group label="Line" icon="◐">
      <label class="panel-field">
        <span class="panel-field-label">Value</span>
        <p-inputnumber
          [ngModel]="line.value"
          [minFractionDigits]="0"
          [maxFractionDigits]="6"
          fluid
          (ngModelChange)="setValue($event)"
        />
      </label>
      <label class="panel-field">
        <span class="panel-field-label">Label</span>
        <input
          type="text"
          pInputText
          placeholder="e.g. Target"
          [ngModel]="line.label"
          (ngModelChange)="setLabel($event)"
        />
      </label>

      <div class="panel-inline-field">
        <p-checkbox
          [binary]="true"
          inputId="guide-line-color"
          [ngModel]="line.color !== null && line.color !== undefined"
          (onChange)="setColor($event.checked ? defaultColor : null)"
        />
        <label for="guide-line-color">Custom colour</label>
        @if (line.color) {
          <input
            type="color"
            class="panel-color-swatch"
            [ngModel]="line.color"
            (ngModelChange)="setColor($event)"
          />
        }
      </div>

      <label class="panel-field">
        <span class="panel-field-label">Line style</span>
        <p-select
          [options]="dashOptions"
          [ngModel]="line.dashStyle ?? 'dashed'"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          fluid
          (onChange)="setDashStyle($event.value ?? null)"
        />
      </label>
    </app-panel-group>

    <p-button
      label="Remove line"
      icon="pi pi-times"
      severity="danger"
      outlined
      fluid
      (onClick)="remove()"
    />
  </div>
} @else {
  <p class="panel-empty">This line is no longer on the chart.</p>
}
