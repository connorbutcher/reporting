<div class="panel-section">
  <p class="panel-hint">
    Pick a widget to place on the canvas. You choose its content afterwards.
  </p>
  @for (entry of groups; track entry.group.id) {
    <div class="panel-add-group">
      <span class="panel-add-group-label">{{ entry.group.label }}</span>
      @for (widget of entry.types; track widget.type) {
        <button type="button" class="panel-menu-item" (click)="addWidget(widget.type)">
          @if (entry.group.id === 'chart') {
            <!-- PrimeIcons only has one generic "bar chart" glyph, which left four chart types
                 (bar/combo/box plot/histogram) all showing the identical icon in this gallery —
                 indistinguishable to someone who doesn't already know what each one looks like.
                 These small custom glyphs sketch each chart's actual shape instead. -->
            <svg
              class="panel-menu-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              aria-hidden="true"
            >
              @switch (widget.type) {
                @case ('scatterChart') {
                  <path d="M4 3v17h17" />
                  <circle cx="8" cy="15" r="1.3" fill="currentColor" stroke="none" />
                  <circle cx="11.5" cy="9" r="1.3" fill="currentColor" stroke="none" />
                  <circle cx="14.5" cy="13.5" r="1.3" fill="currentColor" stroke="none" />
                  <circle cx="17.5" cy="6.5" r="1.3" fill="currentColor" stroke="none" />
                  <circle cx="19.5" cy="11" r="1.3" fill="currentColor" stroke="none" />
                }
                @case ('lineChart') {
                  <path d="M4 3v17h17" />
                  <path d="M6.5 16 10 11l3 3 4.5-7 3 3.5" stroke-linejoin="round" />
                }
                @case ('barChart') {
                  <path d="M4 3v17h17" />
                  <rect x="6.5" y="13" width="2.6" height="7" fill="currentColor" stroke="none" />
                  <rect x="11" y="9" width="2.6" height="11" fill="currentColor" stroke="none" />
                  <rect x="15.5" y="15" width="2.6" height="5" fill="currentColor" stroke="none" />
                  <rect x="20" y="6" width="2.6" height="14" fill="currentColor" stroke="none" />
                }
                @case ('comboChart') {
                  <path d="M4 3v17h17" />
                  <rect x="6.5" y="14" width="2.6" height="6" fill="currentColor" fill-opacity="0.45" stroke="none" />
                  <rect x="11" y="11" width="2.6" height="9" fill="currentColor" fill-opacity="0.45" stroke="none" />
                  <rect x="15.5" y="16" width="2.6" height="4" fill="currentColor" fill-opacity="0.45" stroke="none" />
                  <path d="M7.8 12 12.3 8.5 16.8 13.5 20.5 6" stroke-linejoin="round" />
                }
                @case ('boxPlot') {
                  <path d="M4 3v17h17" />
                  <path d="M13 6v4M13 14v4M10 6h6M10 18h6" />
                  <rect x="9" y="10" width="8" height="4" />
                  <path d="M9 12h8" />
                }
                @case ('histogram') {
                  <path d="M4 3v17h17" />
                  <rect x="6" y="15" width="3.3" height="5" fill="currentColor" stroke="none" />
                  <rect x="9.3" y="9" width="3.3" height="11" fill="currentColor" stroke="none" />
                  <rect x="12.6" y="6" width="3.3" height="14" fill="currentColor" stroke="none" />
                  <rect x="15.9" y="11" width="3.3" height="9" fill="currentColor" stroke="none" />
                  <rect x="19.2" y="17" width="3.3" height="3" fill="currentColor" stroke="none" />
                }
              }
            </svg>
          } @else {
            <i [class]="widget.icon" aria-hidden="true"></i>
          }
          <span class="panel-menu-text">
            <span class="panel-menu-label">{{ widget.label }}</span>
            <span class="panel-menu-hint">{{ widget.hint }}</span>
          </span>
          <i class="pi pi-plus" aria-hidden="true"></i>
        </button>
      }
    </div>
  }
</div>
