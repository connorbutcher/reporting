@if (widgets().length === 0) {
  <p class="panel-empty">No widgets yet. Add one to get started.</p>
} @else {
  <p-listbox
    styleClass="panel-widget-listbox"
    [options]="options()"
    [ngModel]="selectedWidgetId()"
    optionLabel="label"
    optionValue="id"
    dataKey="id"
    ariaLabel="Widgets on the canvas"
    (onClick)="open($event.option?.id)"
    (onChange)="open($event.value)"
  >
    <ng-template #item let-widget>
      <span class="panel-widget-item">
        <i [class]="widget.icon" aria-hidden="true"></i>
        <span class="panel-widget-text">
          <span class="panel-widget-name">{{ widget.label }}</span>
          <span class="panel-widget-meta">{{ widget.typeLabel }}</span>
        </span>
        @if (widget.filterCount; as count) {
          <span
            class="panel-widget-filter-count"
            [attr.aria-label]="count + ' active filter condition' + (count > 1 ? 's' : '')"
          >
            <i class="pi pi-filter" aria-hidden="true"></i>
            {{ count }}
          </span>
        }
      </span>
    </ng-template>
  </p-listbox>
}
<p-button
  label="Add widget"
  icon="pi pi-plus"
  severity="secondary"
  outlined
  fluid
  (onClick)="navigate({ kind: 'addWidget' })"
/>
