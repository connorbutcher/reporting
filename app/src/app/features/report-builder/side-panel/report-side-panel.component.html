<aside class="side-panel app-card">
  <div class="header">
    @if (ancestors().length > 0) {
      <nav class="breadcrumb" aria-label="Panel navigation">
        @for (crumb of crumbs(); track crumbKey(crumb)) {
          @if (crumb === ellipsis) {
            <button
              type="button"
              class="crumb ellipsis"
              aria-label="Show hidden steps"
              (click)="expand()"
            >
              …
            </button>
          } @else {
            <button
              type="button"
              class="crumb"
              [class.home]="crumb.kind === 'root'"
              [attr.aria-label]="crumb.kind === 'root' ? 'Report builder' : null"
              [title]="crumb.kind === 'root' ? null : labelFor(crumb)"
              (click)="navigate(crumb)"
            >
              @if (crumb.kind === 'root') {
                <i class="pi pi-home" aria-hidden="true"></i>
              } @else {
                {{ labelFor(crumb) }}
              }
            </button>
          }
          <i class="pi pi-angle-right crumb-sep" aria-hidden="true"></i>
        }
      </nav>
    }
    <div class="title-row">
      <div class="nav">
        <p-button
          icon="pi pi-chevron-left"
          severity="secondary"
          text
          rounded
          size="small"
          ariaLabel="Back"
          [disabled]="!canGoBack()"
          (onClick)="back()"
        />
        <p-button
          icon="pi pi-chevron-right"
          severity="secondary"
          text
          rounded
          size="small"
          ariaLabel="Forward"
          [disabled]="!canGoForward()"
          (onClick)="forward()"
        />
      </div>
      <h2 class="title">{{ title() }}</h2>
    </div>
  </div>

  <p-divider />

  <div class="body">
    <ng-container [ngComponentOutlet]="currentPanel()" />
  </div>
</aside>
