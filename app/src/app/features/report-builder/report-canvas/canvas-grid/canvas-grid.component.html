@if (loading()) {
  <p class="status-text">Loading report…</p>
} @else {
  <div class="viewport" (pointerdown)="onCanvasPointerDown($event)">
    <div
      #grid
      class="grid"
      [style.grid-template-columns]="'repeat(' + gridColumns() + ', minmax(0, 1fr))'"
      [style.grid-template-rows]="'repeat(' + gridRows() + ', ' + rowHeight + 'px)'"
      [style.gap.px]="gridGap"
      [style.--grid-step-x.px]="columnStep()"
      [style.--grid-step-y.px]="rowStep"
    >
      @for (widget of widgets(); track widget.id) {
        <app-widget-host [widget]="widget" (gridPreview)="onDropPreview($event)" />
      }
      @if (dropPreview(); as preview) {
        <div
          class="drop-preview"
          [class.invalid]="preview.invalid"
          [style.grid-column]="preview.x + 1 + ' / span ' + preview.w"
          [style.grid-row]="preview.y + 1 + ' / span ' + preview.h"
        ></div>
      }
    </div>
  </div>
}
