<header class="builder-toolbar">
  <h1 class="title">{{ reportName() }}</h1>
  <span class="meta">
    {{ gridColumns() }} × {{ gridRows() }} grid ·
    {{ widgets().length }} widgets
    @if (hasMultiSelection()) {
      · {{ selectedWidgetIds().length }} selected
    }
  </span>

  <div class="history">
    <button
      type="button"
      class="icon-button"
      title="Undo (Ctrl+Z)"
      aria-label="Undo"
      [disabled]="!canUndo()"
      (click)="undo()"
    >
      <i class="pi pi-undo" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      class="icon-button"
      title="Redo (Ctrl+Shift+Z)"
      aria-label="Redo"
      [disabled]="!canRedo()"
      (click)="redo()"
    >
      <i class="pi pi-refresh" aria-hidden="true"></i>
    </button>
  </div>

  <span
    class="save-status"
    [class.error]="saveStatus().variant === 'error'"
    [class.pending]="saveStatus().variant === 'pending'"
    [attr.role]="saveStatus().variant === 'error' ? 'alert' : null"
  >
    <i class="pi" [class]="saveStatus().icon" aria-hidden="true"></i>
    {{ saveStatus().label }}
  </span>

  <button
    type="button"
    class="status"
    [class.error]="errors().length > 0"
    [class.warning]="errors().length === 0 && warnings().length > 0"
    (click)="openIssues()"
  >
    <i
      class="pi"
      [class.pi-check-circle]="issues().length === 0"
      [class.pi-exclamation-triangle]="issues().length > 0"
      aria-hidden="true"
    ></i>
    {{ statusLabel() }}
  </button>

  @if (reportId(); as id) {
    <a
      class="datasets"
      [routerLink]="['/reports', id, 'edit', 'datasets']"
      title="Manage this report's datasets"
    >
      <i class="pi pi-database" aria-hidden="true"></i>
      Datasets
    </a>
  }

  <button
    type="button"
    class="publish"
    [disabled]="!hasUnpublishedChanges() || !isValid()"
    [title]="publishTitle()"
    (click)="publish()"
  >
    <i class="pi pi-cloud-upload" aria-hidden="true"></i>
    Publish
  </button>
</header>
