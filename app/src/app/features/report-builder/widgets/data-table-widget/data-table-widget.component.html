@if (loading()) {
  <div class="data-table-widget__status">Loading…</div>
} @else if (error()) {
  <div class="data-table-widget__status data-table-widget__status--error">Failed to load dataset.</div>
} @else {
  <table class="data-table-widget__table">
    <thead>
      <tr>
        @for (column of columns(); track column.id) {
          <th scope="col">{{ column.name }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr>
          @for (column of columns(); track column.id) {
            <td>{{ valueFor(row, column) }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
}
