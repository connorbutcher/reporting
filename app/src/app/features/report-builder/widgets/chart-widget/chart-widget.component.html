@if (!config().datasetId) {
  <div class="status">
    <i [class]="placeholderIcon()" aria-hidden="true"></i>
    Choose a dataset for this chart in the side panel.
  </div>
} @else if (loading()) {
  <div class="status">Loading…</div>
} @else if (error()) {
  <div class="status error">Failed to load dataset.</div>
} @else if (chartOption(); as option) {
  <div echarts [options]="option" [autoResize]="true" class="canvas"></div>
} @else {
  <div class="status">
    <i class="pi pi-sliders-h" aria-hidden="true"></i>
    Pick an X and a Y column from the side panel.
  </div>
}
