@if (viewable()) {
  <button type="button" aria-label="View data" title="View data" (click)="viewData.emit()">
    <i class="pi pi-table" aria-hidden="true"></i>
  </button>
}
<button
  type="button"
  aria-label="Download screenshot (PNG)"
  title="Download screenshot (PNG)"
  (click)="screenshot.emit()"
>
  <i class="pi pi-image" aria-hidden="true"></i>
</button>
<button
  type="button"
  aria-label="Download data (CSV)"
  title="Download data (CSV)"
  (click)="exportCsv.emit()"
>
  <i class="pi pi-download" aria-hidden="true"></i>
</button>
@if (expandable()) {
  <button type="button" aria-label="View full screen" title="View full screen" (click)="expand.emit()">
    <i class="pi pi-window-maximize" aria-hidden="true"></i>
  </button>
}
