<div
  class="surface"
  [appWidgetDrag]="widget()"
  #drag="widgetDrag"
  (selectRequest)="select($event)"
  [appWidgetResize]="widget()"
  #resize="widgetResize"
  (gridPreview)="gridPreview.emit($event)"
  [class.invalid]="drag.invalid()"
  [class.dragging]="drag.dragging()"
  [class.selected]="selected()"
  [class.primary]="primary() && selected()"
  [class.has-error]="hasError()"
  [class.has-warning]="!hasError() && issues().length > 0"
  [style.width.px]="resize.previewSize()?.width ?? null"
  [style.height.px]="resize.previewSize()?.height ?? null"
  [style.transform]="drag.transform()"
  (pointerdown)="select($event)"
>
  <div class="content">
    <div class="header" [class.bare]="!showTitle()" (pointerdown)="drag.start($event)">
      @if (showTitle()) {
        <span class="title">{{ title() }}</span>
      } @else {
        <span class="grip" aria-hidden="true"><i class="pi pi-ellipsis-h"></i></span>
      }
      @if (issues().length > 0) {
        <button
          type="button"
          class="issues"
          [class.error]="hasError()"
          [attr.aria-label]="issueLabel()"
          [title]="issueLabel()"
          (pointerdown)="$event.stopPropagation()"
          (click)="showIssues()"
        >
          <i
            class="pi"
            [class.pi-times-circle]="hasError()"
            [class.pi-exclamation-circle]="!hasError()"
            aria-hidden="true"
          ></i>
          {{ issues().length }}
        </button>
      }
    </div>
    <div class="body">
      <ng-container
        [appWidgetOutlet]="widgetDto()"
        [datasetVersion]="datasetVersion()"
        [reportFilter]="reportFilter()"
        [widgetFilter]="widgetFilter()"
        [widgetOutputs]="widgetOutputs"
      />
    </div>
  </div>
  <button
    type="button"
    class="resize-handle right"
    [class.invalid]="resize.invalid()"
    (pointerdown)="resize.start($event, 'right')"
    aria-label="Resize widget width"
  ></button>
  <button
    type="button"
    class="resize-handle bottom"
    [class.invalid]="resize.invalid()"
    (pointerdown)="resize.start($event, 'bottom')"
    aria-label="Resize widget height"
  ></button>
  <button
    type="button"
    class="resize-handle corner"
    [class.invalid]="resize.invalid()"
    (pointerdown)="resize.start($event, 'corner')"
    aria-label="Resize widget"
  ></button>
</div>
