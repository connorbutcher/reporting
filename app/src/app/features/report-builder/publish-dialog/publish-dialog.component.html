<div class="publish-dialog">
  <header class="header">
    <h2 class="title">Publish version</h2>
    <p class="hint">Describe what changed — this is shown in the report's version history.</p>
  </header>

  <div class="editor" #editor></div>

  <footer class="footer">
    <button type="button" class="button secondary" (click)="cancel()">Cancel</button>
    <button type="button" class="button primary" (click)="publish()">Publish</button>
  </footer>
</div>
