<div class="home-section">
  <span class="home-section-label">Folders</span>
  <div class="home-folder-row">
    @for (row of store.folderRows(); track row.id) {
      <div class="home-folder-chip" (contextmenu)="onContextMenu($event, row)">
        <button type="button" class="home-folder-chip-open" (click)="store.openRow(row)">
          <i class="pi pi-folder home-folder-chip-icon" aria-hidden="true"></i>
          <span class="home-folder-chip-name">{{ row.name }}</span>
        </button>
        <button
          type="button"
          class="home-folder-chip-actions"
          aria-label="Actions"
          (click)="onActions($event, row)"
        >
          <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
        </button>
      </div>
    }
  </div>
</div>
