<div class="move-dialog">
  <header class="move-dialog-header">
    <h2 class="move-dialog-title">Move {{ data.kind }}</h2>
    <p class="move-dialog-hint">Choose a destination for "{{ data.itemName }}".</p>
  </header>

  <div class="move-dialog-tree">
    <p-tree
      [value]="treeNodes()"
      selectionMode="single"
      [selectionKeys]="selectionKeys()"
      (onNodeSelect)="onNodeSelect($event)"
    />
  </div>

  <footer class="move-dialog-footer">
    <button
      type="button"
      class="move-dialog-button move-dialog-button--secondary"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="move-dialog-button move-dialog-button--primary"
      [disabled]="isUnchanged()"
      (click)="move()"
    >
      Move
    </button>
  </footer>
</div>
