<div class="rename-dialog">
  <header class="rename-dialog__header">
    <h2 class="rename-dialog__title">Rename {{ data.kind }}</h2>
  </header>

  <div class="rename-dialog__body">
    <input
      #nameInput
      class="rename-dialog__input"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      (keyup.enter)="save()"
      aria-label="Name"
    />
  </div>

  <footer class="rename-dialog__footer">
    <button
      type="button"
      class="rename-dialog__button rename-dialog__button--secondary"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="rename-dialog__button rename-dialog__button--primary"
      [disabled]="!name().trim()"
      (click)="save()"
    >
      Save
    </button>
  </footer>
</div>
