<div class="rename-dialog">
  <header class="rename-dialog-header">
    <h2 class="rename-dialog-title">Rename {{ data.kind }}</h2>
  </header>

  <div class="rename-dialog-body">
    <input
      #nameInput
      class="rename-dialog-input"
      [value]="form.name().value()"
      (input)="form.name().value.set($any($event.target).value)"
      (blur)="form.name().markAsTouched()"
      (keyup.enter)="save()"
      aria-label="Name"
    />
    @if (nameError(); as message) {
      <p class="rename-dialog-error">{{ message }}</p>
    } @else if (form.name().pending()) {
      <p class="rename-dialog-hint">Checking name…</p>
    }
  </div>

  <footer class="rename-dialog-footer">
    <button
      type="button"
      class="rename-dialog-button rename-dialog-button--secondary"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="rename-dialog-button rename-dialog-button--primary"
      [disabled]="!form().valid()"
      (click)="save()"
    >
      Save
    </button>
  </footer>
</div>
