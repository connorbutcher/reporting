<div class="create-dialog">
  <header class="create-dialog-header">
    <h2 class="create-dialog-title">Create</h2>
  </header>

  <div class="create-dialog-body">
    <div class="create-dialog-type" role="radiogroup" aria-label="What to create">
      <button
        type="button"
        class="create-dialog-type-option"
        role="radio"
        [attr.aria-checked]="kind() === 'folder'"
        [class.create-dialog-type-option--active]="kind() === 'folder'"
        (click)="selectKind('folder')"
      >
        <i class="pi pi-folder" aria-hidden="true"></i>
        Folder
      </button>
      <button
        type="button"
        class="create-dialog-type-option"
        role="radio"
        [attr.aria-checked]="kind() === 'report'"
        [class.create-dialog-type-option--active]="kind() === 'report'"
        (click)="selectKind('report')"
      >
        <i class="pi pi-file" aria-hidden="true"></i>
        Report
      </button>
    </div>

    <input
      #nameInput
      class="create-dialog-input"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      (keyup.enter)="create()"
      [placeholder]="kind() === 'folder' ? 'Folder name' : 'Report name'"
      aria-label="Name"
    />

    @if (kind() === 'report') {
      <p-tree-select
        class="create-dialog-source"
        [options]="treeNodes()"
        [ngModel]="selectedSource()"
        (ngModelChange)="selectedSource.set($event)"
        [filter]="true"
        filterPlaceholder="Search reports"
        placeholder="Copy from an existing report (optional)"
        [showClear]="true"
        appendTo="body"
      />
    }
  </div>

  <footer class="create-dialog-footer">
    <button
      type="button"
      class="create-dialog-button create-dialog-button--secondary"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="create-dialog-button create-dialog-button--primary"
      [disabled]="!name().trim()"
      (click)="create()"
    >
      Create
    </button>
  </footer>
</div>
