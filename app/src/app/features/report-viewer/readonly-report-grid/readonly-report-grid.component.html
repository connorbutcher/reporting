<div class="readonly-grid-viewport">
  <div
    class="readonly-grid"
    [style.grid-template-columns]="'repeat(' + tab().columns + ', minmax(0, 1fr))'"
    [style.grid-template-rows]="'repeat(' + tab().rows + ', ' + rowHeight + 'px)'"
    [style.gap.px]="gridGap"
  >
    @for (widget of tab().widgets; track widget.id) {
      <div
        class="item"
        [appScrollToFragment]="fragmentFor(widget)"
        [style.grid-column]="widget.x + 1 + ' / span ' + widget.w"
        [style.grid-row]="widget.y + 1 + ' / span ' + widget.h"
      >
        <!-- The header is also shown with the title hidden, so a table without a
             title is still filterable and exportable. -->
        <div class="header">
          <span class="title">{{ widget.config.showTitle ? widget.config.title : '' }}</span>
          @if (isExportable(widget)) {
            <app-widget-export-actions
              (screenshot)="outlet.exporter()?.downloadScreenshot()"
              (exportCsv)="outlet.exporter()?.downloadCsv()"
              (expand)="openFullscreen(widget)"
            />
          }
          @if (canFilter(widget)) {
            <button
              type="button"
              class="filter"
              [class.active]="conditionCount(widget) > 0"
              [attr.aria-label]="'Filter ' + (widget.config.title || widget.type)"
              title="Filter this widget"
              (click)="filterWidget.emit(widget.id)"
            >
              <i class="pi pi-filter" aria-hidden="true"></i>
              @if (conditionCount(widget); as count) {
                <span class="filter-count">{{ count }}</span>
              }
            </button>
          }
          <button
            type="button"
            class="comments"
            [class.has-comments]="commentCount(widget) > 0"
            [attr.aria-label]="'Comments on ' + (widget.config.title || widget.type)"
            title="View or add comments"
            (click)="commentsRequest.emit(widget.id)"
          >
            <i class="pi pi-comments" aria-hidden="true"></i>
            @if (commentCount(widget); as count) {
              <span class="filter-count">{{ count }}</span>
            }
          </button>
        </div>

        <div class="body">
          <ng-container
            [appWidgetOutlet]="widget"
            #outlet="widgetOutlet"
            [reportFilter]="reportFilterFor(widget)"
            [widgetFilter]="widgetFilterFor(widget)"
            [bindingFilters]="bindingFiltersFor(widget)"
            [widgetOutputs]="outputsFor(widget)"
          />
        </div>
      </div>
    }
  </div>
</div>
