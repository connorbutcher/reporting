<div class="readonly-grid-viewport">
  <div
    class="readonly-grid"
    [style.grid-template-columns]="'repeat(' + content().columns + ', ' + cellSize + 'px)'"
    [style.grid-template-rows]="'repeat(' + content().rows + ', ' + cellSize + 'px)'"
    [style.gap.px]="gridGap"
  >
    @for (widget of content().widgets; track widget.id) {
      <div
        class="readonly-grid__item"
        [style.grid-column]="widget.x + 1 + ' / span ' + widget.w"
        [style.grid-row]="widget.y + 1 + ' / span ' + widget.h"
      >
        @if (widget.config.showTitle) {
          <div class="readonly-grid__header">
            <span class="readonly-grid__title">{{ widget.config.title }}</span>
          </div>
        }

        <!-- Overlaid rather than placed in the header, so a table with its title
             hidden is still filterable. -->
        @if (canFilter(widget)) {
          <button
            type="button"
            class="readonly-grid__filter"
            [class.readonly-grid__filter--active]="conditionCount(widget) > 0"
            [attr.aria-label]="'Filter ' + (widget.config.title || 'table')"
            title="Filter this table"
            (click)="filterWidget.emit(widget.id)"
          >
            <i class="pi pi-filter" aria-hidden="true"></i>
            @if (conditionCount(widget); as count) {
              <span class="readonly-grid__filter-count">{{ count }}</span>
            }
          </button>
        }

        <div class="readonly-grid__body">
          @if (widget.type === 'dataTable') {
            <app-data-table-widget
              [config]="widget.config"
              [reportFilter]="reportFilterFor(widget.config.datasetId)"
              [widgetFilter]="widgetFilterFor(widget)"
            />
          } @else {
            <app-static-text-widget [config]="widget.config" />
          }
        </div>
      </div>
    }
  </div>
</div>
