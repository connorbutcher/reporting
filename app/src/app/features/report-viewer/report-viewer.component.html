<div class="report-viewer">
  @if (loading()) {
    <p class="status">Loading…</p>
  } @else if (notFound()) {
    <p class="status">Report not found.</p>
  } @else if (report()) {
    <section class="main app-card">
      <app-report-viewer-header />

      @if (content(); as content) {
        <app-readonly-report-grid
          [content]="content"
          [pageFilters]="viewFilters()?.pageFilters ?? null"
          [widgetFilters]="viewFilters()?.widgetFilters ?? null"
          (filterWidget)="filterWidget($event)"
        />
      } @else {
        <p class="status">
          This report has no published version yet. Check it out to start building it.
        </p>
      }
    </section>

    <app-report-viewer-aside />
  }
</div>
