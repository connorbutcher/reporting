@if (versions().length === 0) {
  <p class="status">No published versions yet.</p>
} @else {
  <ul class="version-history">
    @for (version of versions(); track version.versionNumber) {
      @let isActive =
        viewingVersion() === version.versionNumber ||
        (!viewingVersion() && version.versionNumber === report()?.latestVersionNumber);
      <li>
        <button
          type="button"
          class="version"
          [class.active]="isActive"
          (click)="viewVersion(version.versionNumber)"
        >
          <span class="version-row">
            <span>v{{ version.versionNumber }}</span>
            <span class="version-date">{{ version.publishedAt | date: 'short' }}</span>
          </span>
          @if (version.notes; as notes) {
            @if (isActive) {
              <div class="version-notes full" [innerHTML]="notes"></div>
            } @else {
              <span class="version-notes">{{ previewText(notes) }}</span>
            }
          }
        </button>
      </li>
    }
  </ul>
}
