<aside class="report-aside app-card">
  <div class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="tab"
      [class.active]="asideTab() === 'filters'"
      [attr.aria-selected]="asideTab() === 'filters'"
      (click)="showTab('filters')"
    >
      Filters
      @if (viewFilters()?.conditionCount(); as count) {
        <span class="tab-badge">{{ count }}</span>
      }
    </button>
    <button
      type="button"
      role="tab"
      class="tab"
      [class.active]="asideTab() === 'history'"
      [attr.aria-selected]="asideTab() === 'history'"
      (click)="showTab('history')"
    >
      History
    </button>
  </div>

  @if (asideTab() === 'filters') {
    @if (viewFilters(); as filters) {
      <app-view-filters-panel [filters]="filters" [(openKey)]="openFilterKey" />
    } @else {
      <p class="status">Nothing to filter yet.</p>
    }
  } @else {
    <app-version-history />
  }
</aside>
