@if (!selected()) {
  <p class="empty">Pick a dataset on the left, or create one.</p>
} @else {
  <app-dataset-toolbar />

  @if (actionError(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <app-dataset-source-panel />
  <app-dataset-columns-panel />
  <app-dataset-rows-panel />
}
