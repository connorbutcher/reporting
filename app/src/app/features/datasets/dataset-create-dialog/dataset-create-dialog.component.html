<div class="dialog">
  <header class="header">
    <h2 class="title">New dataset</h2>
  </header>

  <div class="body">
    <div class="field">
      <span class="label">Source system</span>
      <div class="sources" role="radiogroup" aria-label="Source system">
        @for (source of data.sources; track source.id) {
          <button
            type="button"
            class="source"
            role="radio"
            [attr.aria-checked]="source.id === form.sourceId().value()"
            [class.active]="source.id === form.sourceId().value()"
            (click)="selectSource(source.id)"
          >
            <i [class]="icon(source.key)" aria-hidden="true"></i>
            {{ source.name }}
          </button>
        }
      </div>
      <p class="hint">{{ hint() }}</p>
    </div>

    <div class="field">
      <span class="label">Name</span>
      <input
        #nameInput
        pInputText
        [value]="form.name().value()"
        (input)="form.name().value.set(nameInput.value)"
        (blur)="form.name().markAsTouched()"
        [invalid]="(form.name().touched() || form.name().dirty()) && form.name().invalid()"
        (keyup.enter)="create()"
        placeholder="Dataset name"
        aria-label="Dataset name"
      />
      @if (nameError(); as message) {
        <p class="error">{{ message }}</p>
      }
    </div>
  </div>

  <footer class="footer">
    <p-button label="Cancel" severity="secondary" outlined (onClick)="cancel()" />
    <p-button label="Create" [disabled]="!form().valid()" (onClick)="create()" />
  </footer>
</div>
