@if (range()) {
  <div class="bar" role="toolbar" aria-label="Selected items">
    <span class="count">{{ count() }} selected</span>

    @if (contiguous()) {
      <p-button label="Wrap in ( )" severity="secondary" size="small" outlined (onClick)="wrapInBrackets()" />
      <p-select
        #wrapSelect
        [options]="functions()"
        optionLabel="name"
        [filter]="true"
        filterBy="name,description"
        placeholder="Wrap in function…"
        appendTo="body"
        size="small"
        ariaLabel="Wrap the selection in a function"
        [ngModel]="null"
        (onChange)="wrapIn($event.value, wrapSelect)"
      >
        <ng-template let-fn #item>
          <span class="fn-name">{{ fn.name }}</span>
          <span class="fn-what">{{ fn.description }}</span>
        </ng-template>
      </p-select>
    } @else {
      <span class="note">Select items that are next to each other to wrap them.</span>
    }

    @if (canUnwrap()) {
      <p-button label="Remove brackets" severity="secondary" size="small" text (onClick)="unwrap()" />
    }

    <span class="spacer"></span>
    <p-button label="Copy" icon="pi pi-copy" severity="secondary" size="small" text (onClick)="copy()" />
    <p-button label="Delete" icon="pi pi-trash" severity="danger" size="small" text (onClick)="remove()" />
    <p-button icon="pi pi-times" severity="secondary" size="small" text ariaLabel="Clear the selection" (onClick)="clear()" />
  </div>
}
