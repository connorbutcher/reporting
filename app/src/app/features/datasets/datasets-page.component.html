<div class="datasets">
  <aside class="datasets__list app-card">
    <header class="datasets__list-header">
      <a
        class="datasets__back"
        [routerLink]="['/reports', reportId, 'edit']"
        aria-label="Back to report"
      >
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        Back to report
      </a>
      <h1 class="datasets__heading">Datasets</h1>
    </header>

    <div class="datasets__new">
      <input
        pInputText
        [ngModel]="newDatasetName()"
        (ngModelChange)="newDatasetName.set($event)"
        (keyup.enter)="createDataset()"
        placeholder="New dataset name"
        aria-label="New dataset name"
      />
      <p-button
        icon="pi pi-plus"
        severity="secondary"
        ariaLabel="Create dataset"
        [disabled]="!newDatasetName().trim()"
        (onClick)="createDataset()"
      />
    </div>

    @if (store.datasets().length === 0) {
      <p class="datasets__empty">No datasets yet.</p>
    } @else {
      <ul class="datasets__items">
        @for (dataset of store.datasets(); track dataset.id) {
          <li>
            <button
              type="button"
              class="datasets__item"
              [class.datasets__item--active]="dataset.id === store.selectedId()"
              (click)="store.select(dataset.id)"
            >
              <i class="pi pi-database" aria-hidden="true"></i>
              {{ dataset.name }}
            </button>
          </li>
        }
      </ul>
    }
  </aside>

  <app-dataset-editor />
</div>
